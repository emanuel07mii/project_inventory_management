{% extends "shared/layout.html" %}
{% load static %}

{% block title %} Register - Inventory App {% endblock %}

{% block content %}

    <body>
        <div class="row col-12 justify-content-center">
            <form method="post" action="{% url 'register' %}" class="shadow p-3 mt-5 col-12 col-md-8 col-lg-5">
                <h2 class="text-center">Register</h2>
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-group mb-3">
                    <button class="btn btn-primary w-100" type="submit">Register</button>
                </div>
                <p>Do you have an account? <a href="{% url 'login' %}">Log in</a></p>
            </form>
        </div>
    </body>

{% endblock %}
