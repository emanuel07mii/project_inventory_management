{% extends "shared/layout.html" %}
{% load static %}

{% block title %} Login {% endblock %}

{% block content %}

    <body>
        <div class="container">
            <h2>Register</h2>
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Register</button>
            </form>

            <p>Do you have an account? <a href="{% url 'login' %}">Log in</a></p>
        </div>
    </body>

{% endblock %}
